name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release runs must check out the tag. A detached commit without
          # that ref makes npm provenance fail with Missing SourceRepositoryRef.
          # workflow_dispatch keeps the ref that was selected.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # No package-lock.json and no dependencies, so skip npm ci.
      # There is no build step.

      - name: Publish to npm
        run: |
          # setup-node writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
          # With no npm token that empty value is sent instead of the OIDC
          # trusted-publisher exchange, and the registry answers 404.
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            grep -v '_authToken' "$NPM_CONFIG_USERCONFIG" > "$NPM_CONFIG_USERCONFIG.noidc"
            mv "$NPM_CONFIG_USERCONFIG.noidc" "$NPM_CONFIG_USERCONFIG"
          fi
          npm publish --access public --loglevel verbose
